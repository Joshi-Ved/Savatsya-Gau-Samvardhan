name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install using your ROOT package-lo=ck.json
      - name: Install dependencies
        run: npm ci

      # Build Frontend
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build || true

      # Build Backend
      - name: Build Backend
        working-directory: ./backend
        run: npm run build || true